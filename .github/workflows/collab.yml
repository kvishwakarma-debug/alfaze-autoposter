name: Daily Collab Queue
on:
  schedule:
    - cron: '0 3 * * *' # Roz subah 8:30 IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python collab/collab_finder.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - run: |
          git config --global user.name "collab-bot"
          git config --global user.email "bot@alfaze.com"
          git add collab/data/
          git commit -m "daily queue update" || exit 0
          git push
