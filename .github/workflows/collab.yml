name: Collab Finder Daily

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  find-collabs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requests
        run: pip install requests
      - name: Run Finder and Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: python collab/collab_finder.py
      - name: Commit Daily List
        run: |
          git config --global user.name "Alfaz Bot"
          git config --global user.email "bot@alfaze.ulfat"
          git pull --rebase origin main
          git add collab/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "daily collab" && git push)
