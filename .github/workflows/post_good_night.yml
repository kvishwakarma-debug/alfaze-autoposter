name: Post Good Night Shayari

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install Pillow requests
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-cjk || true
      - name: Run Good Night Poster (Feed + Story, No Box)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: |
          python scripts/post_good_night.py
      - name: Commit tracker
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_good_night_index.json output/good_night.jpg || true
          git diff --staged --quiet || git commit -m "Auto: Good Night poster $(date +'%Y-%m-%d')"
          git push || echo "No changes"
