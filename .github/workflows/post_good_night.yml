name: Post Good Night Shayari

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'  # 10:00 PM IST = 4:30 PM UTC = 16:30 UTC

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install Pillow requests
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk || true

      - name: Run Good Night Poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/post_good_night.py

      - name: Commit tracker and image
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_good_night_index.json output/good_night.jpg || true
          git diff --staged --quiet || git commit -m "Auto: Good Night poster $(date +'%Y-%m-%d')"
          git push || echo "No changes to push"
