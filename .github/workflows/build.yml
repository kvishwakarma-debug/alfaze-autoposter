name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Validate Manifest JSON
      run: |
        python3 -c "import json; json.load(open('chrome-extension/manifest.json'))"
        echo "Manifest JSON format is valid!"

    - name: Create Extension Package (ZIP)
      run: |
        cd chrome-extension
        zip -r ../insta-ai-extension.zip .

    - name: Upload Extension Artifact
      uses: actions/upload-artifact@v4
      with:
        name: insta-ai-extension
        path: insta-ai-extension.zip
