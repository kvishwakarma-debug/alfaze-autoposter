name: Build Chrome Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Validate Manifest JSON
      run: |
        if [ -f "manifest.json" ]; then
          python3 -c "import json; json.load(open('manifest.json'))"
        elif [ -f "chrome-extension/manifest.json" ]; then
          python3 -c "import json; json.load(open('chrome-extension/manifest.json'))"
        else
          echo "Manifest file not found!" && exit 1
        fi
        echo "Manifest JSON format is valid!"

    - name: Create Extension Package (ZIP)
      run: |
        if [ -d "chrome-extension" ]; then
          cd chrome-extension && zip -r ../insta-ai-extension.zip .
        else
          zip -r insta-ai-extension.zip . -x "*.git*" ".github/*"
        fi

    - name: Upload Extension Artifact
      uses: actions/upload-artifact@v4
      with:
        name: insta-ai-extension
        path: insta-ai-extension.zip
