name: Post English Quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *' # Daily 12:30 PM UTC = 6:00 PM IST (matches your cron-job.org)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install Pillow requests
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Run English Quote Poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/post_english_quotes.py
