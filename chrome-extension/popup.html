<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #dc2743;
      text-align: center;
      font-size: 16px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      display: block;
      margin-bottom: 4px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    button {
      padding: 10px;
      background: #0095f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      font-size: 12px;
      text-align: center;
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>✨ Insta AI Settings</h3>
  
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Paste Gemini API Key here">
  <button id="saveKey">Save Key</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
