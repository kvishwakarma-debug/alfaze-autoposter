<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; font-family: sans-serif; padding: 12px; margin: 0; }
    h4 { margin: 0 0 8px 0; font-size: 14px; }
    label { font-size: 11px; color: #555; }
    input { width: 100%; padding: 6px; margin: 6px 0 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 7px; background: #0095f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0081d6; }
    #status { color: #10B981; font-size: 11px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <h4>Insta AI Settings</h4>
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />
  <button id="saveBtn">Save Key</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
